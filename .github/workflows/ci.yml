name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly dependency audit even when there's no open PR to trigger one.
    - cron: '0 0 1 * *'

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: pnpm audit
        run: |
          # registry.npmjs.org's audit endpoint times out often enough on GitHub's
          # runners that pnpm's own built-in retry (which this log already shows
          # exhausting — 10s then 1min backoff) isn't always enough. Outer retry
          # so a transient registry blip doesn't fail the whole build; a real
          # vulnerability finding will still fail every attempt.
          for i in 1 2 3; do
            pnpm audit && exit 0
            echo "pnpm audit attempt $i/3 failed, retrying in 30s..."
            sleep 30
          done
          exit 1

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: |
          for i in 1 2 3; do
            pnpm audit && exit 0
            echo "pnpm audit attempt $i/3 failed, retrying in 30s..."
            sleep 30
          done
          exit 1
