name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly dependency audit even when there's no open PR to trigger one.
    - cron: '0 0 1 * *'

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: pnpm audit
        run: |
          # registry.npmjs.org's audit endpoint is flaky on hosted runners.
          # Keep failing for real audit findings, but don't fail build on
          # repeated ERR_SOCKET_TIMEOUT from the upstream audit endpoint.
          for i in 1 2 3; do
            set +e
            output="$(pnpm audit 2>&1)"
            status=$?
            set -e
            echo "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if echo "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|Socket timeout'; then
              if [ "$i" -lt 3 ]; then
                echo "pnpm audit attempt $i/3 hit registry timeout, retrying in 30s..."
                sleep 30
                continue
              fi
              echo "pnpm audit timed out after 3 attempts; not failing build on transient registry outage."
              exit 0
            fi

            exit "$status"
          done
          exit 0

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: |
          for i in 1 2 3; do
            pnpm audit && exit 0
            echo "pnpm audit attempt $i/3 failed, retrying in 30s..."
            sleep 30
          done
          exit 1
