name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly dependency audit even when there's no open PR to trigger one.
    - cron: '0 0 1 * *'

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: pnpm audit
        run: |
          # registry.npmjs.org's audit endpoint times out often enough on GitHub's
          # runners that pnpm's own built-in retry (10s then 1min backoff) isn't
          # always enough — confirmed live: 3 straight CI runs failed on
          # ERR_SOCKET_TIMEOUT alone, no actual finding. A real vulnerability
          # finding is deterministic (fails every attempt, not just some), so:
          # retry only on a recognized timeout, fail immediately on anything else,
          # and don't fail the build if every retry was itself a timeout — an
          # unreachable registry isn't a reason to block a deploy.
          for i in 1 2 3; do
            set +e
            output="$(pnpm audit 2>&1)"
            status=$?
            set -e
            echo "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if echo "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|Socket timeout'; then
              if [ "$i" -lt 3 ]; then
                echo "pnpm audit attempt $i/3 hit a registry timeout, retrying in 30s..."
                sleep 30
                continue
              fi
              echo "pnpm audit timed out on all 3 attempts — treating as a transient registry outage, not failing the build."
              exit 0
            fi

            exit "$status"
          done

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: |
          for i in 1 2 3; do
            pnpm audit && exit 0
            echo "pnpm audit attempt $i/3 failed, retrying in 30s..."
            sleep 30
          done
          exit 1
